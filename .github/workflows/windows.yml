name: Windows build

# Her push'ta bir TEST paketi üretilir (kendinden imzalı, kendi bilgisayarınızda denemek için).
# Store paketi: Actions → Windows build → Run workflow. Partner Center değerleri
# (AppicStudio.scanload) varsayılan olarak dolu gelir; yalnızca sürümü artırmanız yeterli.

on:
  push:
    paths-ignore:
      - "simple/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (X.Y.Z.0). Increase it for every Store update, e.g. 1.1.1.0"
        default: "1.1.0.0"
      identity_name:
        description: "Package/Identity/Name (Partner Center → Product identity). Clear it for a self-signed test build"
        default: "AppicStudio.scanload"
      publisher:
        description: "Package/Identity/Publisher"
        default: "CN=7A142A12-13C0-4551-B626-6D1C8B235E09"
      publisher_display_name:
        description: "Package/Properties/PublisherDisplayName"
        default: "Appic Studio"
      display_name:
        description: "Reserved product name, exactly as in Partner Center (case-sensitive)"
        default: "scanload"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version || '1.1.0.0' }}
      IDENTITY_NAME: ${{ inputs.identity_name }}
      PUBLISHER: ${{ inputs.publisher }}
      PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
      DISPLAY_NAME: ${{ inputs.display_name || 'Scanload' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build, self-test, package MSIX
        shell: pwsh
        run: |
          if ($env:IDENTITY_NAME) {
            if (-not $env:PUBLISHER -or -not $env:PUBLISHER_DISPLAY_NAME) {
              throw "Store build needs all three Partner Center values."
            }
            Write-Host "Store build for $env:IDENTITY_NAME"
            ./build.ps1 -Version $env:VERSION -IdentityName $env:IDENTITY_NAME `
              -Publisher $env:PUBLISHER -PublisherDisplayName $env:PUBLISHER_DISPLAY_NAME `
              -DisplayName $env:DISPLAY_NAME
          } else {
            Write-Host "Test build (self-signed)"
            ./build.ps1 -Version $env:VERSION -DisplayName $env:DISPLAY_NAME -Sign
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.identity_name != '' && 'Scanload-STORE' || 'Scanload-test' }}
          path: |
            build/*.msix
            build/*.zip
            build/test.cer
          if-no-files-found: error
